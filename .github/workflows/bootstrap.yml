name: bootstrap

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Verify WP-0005 PostgreSQL local environment
        run: ./tooling/postgres/verify-local.sh

      - name: Verify WP-0006 root environment and startup
        run: pnpm environment:verify

      - name: Verify workspace baseline
        run: |
          test "$(pnpm exec turbo --version)" = "2.10.5"
          for package in api worker merchant-web customer-pwa; do test -f "apps/$package/package.json"; done
          test -f packages/ui/package.json
          node -e 'const fs=require("node:fs"); for (const file of ["package.json","turbo.json","docs/product/screen-registry.schema.json","apps/customer-pwa/public/manifest.webmanifest"]) JSON.parse(fs.readFileSync(file))'
          node --input-type=module -e 'import fs from "node:fs"; import { parse } from "yaml"; for (const file of ["pnpm-workspace.yaml",".github/workflows/bootstrap.yml","docs/product/screen-registry.yaml"]) parse(fs.readFileSync(file, "utf8"))'
          pnpm repository-guidance:check
          pnpm module-manifest:check
          pnpm module-generator:check
          pnpm import-boundary:check
          pnpm database-ownership:check
          pnpm database-permission:check
          pnpm domain-layer-boundary:check
          pnpm migration:check
          pnpm db:migrate -- --help
          pnpm foundation:check
          pnpm foundation:verify -- --help
          pnpm helpers:check
          pnpm openapi:check
          pnpm helpers:verify -- --help
          pnpm screen-registry:check
          pnpm list --depth 0
          pnpm exec turbo run build --dry=json
          git diff --check

      - name: Verify TypeScript and quality tooling
        run: |
          test "$(pnpm exec tsc --version)" = "Version 6.0.3"
          test "$(pnpm exec eslint --version)" = "v10.7.0"
          test "$(pnpm exec prettier --version)" = "3.9.5"
          test "$(pnpm exec vitest --version | cut -d' ' -f1)" = "vitest/4.1.10"
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm screen-registry:check
          pnpm build

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build workspace
        run: pnpm build

      - name: Unit and package tests
        run: |
          pnpm exec vitest run
          pnpm exec turbo run test

  database:
    name: database ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build workspace
        run: pnpm build

      - name: Install browser for database journeys
        run: pnpm --filter @bop-rms/merchant-web exec playwright install --with-deps chromium

      - name: PostgreSQL acceptance shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "8"
        run: |
          node -e 'const s=require("./package.json").scripts["test:database"]; const c=[...s.matchAll(/--config (\S+)/g)].map((m)=>m[1]); const mine=c.filter((_,i)=>i%Number(process.env.SHARDS)===Number(process.env.SHARD)-1); if(!c.length||!mine.length) process.exit(1); console.log(mine.join("\n"))' > "$RUNNER_TEMP/configs.txt"
          echo "$(wc -l < "$RUNNER_TEMP/configs.txt") configs in this shard"
          while read -r config; do
            echo "::group::$config"
            pnpm exec vitest run --config "$config" < /dev/null
            echo "::endgroup::"
          done < "$RUNNER_TEMP/configs.txt"

  browser:
    name: customer browser and eventing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build workspace
        run: pnpm build

      - name: Verify local demo browser acceptance
        run: |
          pnpm --filter @bop-rms/merchant-web exec playwright install --with-deps chromium
          pnpm customer-demo-browser:acceptance
          pnpm customer-lab:acceptance

      - name: Verify WP-0036 Realtime and Eventing regressions
        run: |
          pnpm realtime:acceptance
          pnpm event-catalog:acceptance
          pnpm outbox:acceptance
          pnpm outbox-dispatcher:acceptance
          pnpm consumer-inbox:acceptance
          pnpm retry-dead-letter:acceptance
          pnpm correlation-context:acceptance

      - name: Verify frozen install idempotence
        run: |
          before="$(sha256sum pnpm-lock.yaml)"
          pnpm install --frozen-lockfile
          after="$(sha256sum pnpm-lock.yaml)"
          test "$before" = "$after"

      - name: Verify WP-0024 isolated PostgreSQL lifecycle
        run: pnpm isolated-database:acceptance

  merchant-browser:
    name: merchant browser ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build workspace
        run: pnpm build

      - name: Merchant browser acceptance shard
        run: |
          pnpm --filter @bop-rms/merchant-web exec playwright install --with-deps chromium
          pnpm --filter @bop-rms/merchant-web exec playwright test --shard=${{ matrix.shard }}/3

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [static, unit, database, merchant-browser, browser]
    steps:
      - name: All verification jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = "success"; done
