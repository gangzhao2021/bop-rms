name: bootstrap

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact package manager
        run: |
          npm install --global corepack@0.35.0
          corepack enable pnpm
          corepack install --global pnpm@11.13.0

      - name: Verify tool versions
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(corepack --version)" = "0.35.0"
          test "$(pnpm --version)" = "11.13.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify WP-0005 PostgreSQL local environment
        run: ./tooling/postgres/verify-local.sh

      - name: Verify WP-0006 root environment and startup
        run: pnpm environment:verify

      - name: Verify workspace baseline
        run: |
          test "$(pnpm exec turbo --version)" = "2.10.5"
          for package in api worker merchant-web customer-pwa; do test -f "apps/$package/package.json"; done
          test -f packages/ui/package.json
          node -e 'const fs=require("node:fs"); for (const file of ["package.json","turbo.json","docs/product/screen-registry.schema.json","apps/customer-pwa/public/manifest.webmanifest"]) JSON.parse(fs.readFileSync(file))'
          node --input-type=module -e 'import fs from "node:fs"; import { parse } from "yaml"; for (const file of ["pnpm-workspace.yaml",".github/workflows/bootstrap.yml","docs/product/screen-registry.yaml"]) parse(fs.readFileSync(file, "utf8"))'
          pnpm repository-guidance:check
          pnpm module-manifest:check
          pnpm module-generator:check
          pnpm import-boundary:check
          pnpm database-ownership:check
          pnpm domain-layer-boundary:check
          pnpm migration:check
          pnpm db:migrate -- --help
          pnpm foundation:check
          pnpm foundation:verify -- --help
          pnpm helpers:check
          pnpm helpers:verify -- --help
          pnpm screen-registry:check
          pnpm list --depth 0
          pnpm exec turbo run build --dry=json
          git diff --check

      - name: Verify TypeScript and quality tooling
        run: |
          test "$(pnpm exec tsc --version)" = "Version 6.0.3"
          test "$(pnpm exec eslint --version)" = "v10.7.0"
          test "$(pnpm exec prettier --version)" = "3.9.5"
          test "$(pnpm exec vitest --version | cut -d' ' -f1)" = "vitest/4.1.10"
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm screen-registry:check
          pnpm test
          pnpm build

      - name: Verify frozen install idempotence
        run: |
          before="$(sha256sum pnpm-lock.yaml)"
          pnpm install --frozen-lockfile
          after="$(sha256sum pnpm-lock.yaml)"
          test "$before" = "$after"

      - name: Verify WP-0024 isolated PostgreSQL lifecycle
        run: pnpm isolated-database:acceptance
