packages:
  - apps/*
  - packages/*
  - packages/bop/*
  - packages/rms/*
  - tooling/*

allowBuilds:
  "@asyncapi/cli": false
  "@hyperjump/json-pointer": false
  "@hyperjump/json-schema": false
  "@hyperjump/json-schema-core": false
  "@hyperjump/pact": false
  "@scarf/scarf": false
  esbuild: true
  protobufjs: false
  yarn: false

overrides:
  "@asyncapi/generator-react-sdk@1.1.3>@babel/core": 7.29.7

autoInstallPeers: false
engineStrict: true
nodeVersion: 24.18.0
pmOnFail: error
preferFrozenLockfile: true
savePrefix: ""
strictPeerDependencies: true
