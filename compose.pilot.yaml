# WP-2423 P1: run the single-store pilot (database, supervised services, loopback ports).
# All pilot containers share the database container's network namespace, so the installation's
# fixed 127.0.0.1 database, API (4300) and Customer HTTPS (4443) addresses keep working.
# Services bind to loopback; the proxy forwards the published host ports to them.
#
#   PILOT_UID=$(id -u) PILOT_GID=$(id -g) PILOT_RUNTIME_DIRECTORY=.local/pilot-v15 \
#     PILOT_OFFSITE_DIR=$HOME/bop-rms-pilot-offsite docker compose -f compose.pilot.yaml up -d --build
name: bop-rms-pilot

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    restart: unless-stopped
    init: true
    environment:
      TZ: UTC
      # An existing role for the readiness probe; without it pg_isready logs a FATAL per probe.
      PILOT_DB_HEALTH_ROLE: ${PILOT_DB_HEALTH_ROLE:-bop_rms_wp2402_v4_admin}
    command: [postgres, -c, port=55435, -c, timezone=UTC, -c, "datestyle=ISO, YMD"]
    ports:
      - 127.0.0.1:55435:55435
      - 127.0.0.1:4300:14300
      - 127.0.0.1:4443:14443
    volumes:
      - pilot-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready --quiet --host=127.0.0.1 --port=55435 --username="$$PILOT_DB_HEALTH_ROLE" --dbname=postgres',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    stop_grace_period: 30s

  pilot:
    build:
      context: .
      dockerfile: Dockerfile.pilot
      args:
        # InternalTest simulated payments only; remove when switching to a real Provider.
        VITE_BOP_INTERNAL_SIMULATED_PAYMENT: "1"
    image: bop-rms-pilot:local
    restart: unless-stopped
    init: true
    user: "${PILOT_UID:?Set PILOT_UID to the owner of the runtime directory}:${PILOT_GID:?Set PILOT_GID}"
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    # Mount the parent of the runtime directory: Docker Desktop shows a bind-mount root as
    # root-owned, while the runtime directory below it keeps its real owner and mode.
    volumes:
      - ${PILOT_RUNTIME_ROOT:-./.local/pilot-runtime}:/app/.local
    environment:
      PILOT_RUNTIME_DIRECTORY: ${PILOT_RUNTIME_DIRECTORY:?Set PILOT_RUNTIME_DIRECTORY, e.g. .local/pilot-v15}
    stop_grace_period: 60s

  # WP-2423 Q13 (DEC-PILOT-ALERTS-BACKUP): operations monitor and scheduled backups. A separate
  # container from the supervisor, so a stopped supervisor, API or HTTPS entry is still noticed.
  # It probes the published entries through the proxy ports, reads health files, writes the alert
  # board shown on the merchant Home and runs the daily backup (configured in <runtime>/ops.json).
  ops:
    image: bop-rms-pilot:local
    restart: unless-stopped
    init: true
    user: "${PILOT_UID:?Set PILOT_UID to the owner of the runtime directory}:${PILOT_GID:?Set PILOT_GID}"
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
      pilot:
        condition: service_started
    volumes:
      - ${PILOT_RUNTIME_ROOT:-./.local/pilot-runtime}:/app/.local
      # Free space of the database volume only (read-only; the monitor never reads its files).
      - pilot-data:/pilot-data:ro
      # Off-site copy target: an external drive or a folder a sync client copies off this host.
      # Copies are encrypted before they are written. Required, so a redeploy cannot silently
      # fall back to a folder on the same disk (WP-2423 2026-10-17).
      - ${PILOT_OFFSITE_DIR:?Set PILOT_OFFSITE_DIR to the off-site folder}:/offsite
    environment:
      PILOT_RUNTIME_DIRECTORY: ${PILOT_RUNTIME_DIRECTORY:?Set PILOT_RUNTIME_DIRECTORY, e.g. .local/pilot-v15}
    command: [sh, tooling/environment/pilot-ops-container-start.sh]
    stop_grace_period: 90s

  proxy:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    restart: unless-stopped
    network_mode: service:postgres
    depends_on: [postgres]
    entrypoint: [sh, -c]
    command:
      - >-
        socat TCP-LISTEN:14300,fork,reuseaddr TCP:127.0.0.1:4300 &
        exec socat TCP-LISTEN:14443,fork,reuseaddr TCP:127.0.0.1:4443

volumes:
  pilot-data:
    name: ${PILOT_DATA_VOLUME:-bop-rms-pilot-v14-mac-data}
    external: true
